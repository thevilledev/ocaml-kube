apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: greetings.demo.ocaml-kube.dev
spec:
  group: demo.ocaml-kube.dev
  scope: Namespaced
  names:
    plural: greetings
    singular: greeting
    kind: Greeting
    listKind: GreetingList
    shortNames:
      - greet
  versions:
    -
      name: v1alpha1
      served: true
      storage: true
      subresources:
        status:
          {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  minLength: 1
                  description: "Message reconciled into status."
            status:
              type: object
              required:
                - observedGeneration
                - reconciledMessage
                - phase
                - conditions
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                reconciledMessage:
                  type: string
                phase:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum:
                        - Pending
                        - Ready
                        - Failed
                    value:
                      type: object
                      required:
                        - value
                      properties:
                        value:
                          type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                        minLength: 1
                        maxLength: 316
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                      message:
                        type: string
                        maxLength: 32768

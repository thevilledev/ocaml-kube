apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: greetings.demo.kube-ocaml.dev
spec:
  group: demo.kube-ocaml.dev
  scope: Namespaced
  names:
    plural: greetings
    singular: greeting
    kind: Greeting
    shortNames:
      - greet
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  minLength: 1
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                reconciledMessage:
                  type: string

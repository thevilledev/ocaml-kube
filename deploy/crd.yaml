apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: greetings.demo.ocaml-k8s.dev
spec:
  group: demo.ocaml-k8s.dev
  scope: Namespaced
  names:
    plural: greetings
    singular: greeting
    kind: Greeting
    listKind: GreetingList
    shortNames:
      - greet
  versions:
    -
      name: v1alpha1
      served: true
      storage: true
      subresources:
        status:
          {}
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  minLength: 1
                  description: "Message reconciled into status."
            status:
              type: object
              required:
                - observedGeneration
                - reconciledMessage
                - phase
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                reconciledMessage:
                  type: string
                phase:
                  type: object
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      enum:
                        - Pending
                        - Ready
                        - Failed
                    value:
                      type: object
                      required:
                        - value
                      properties:
                        value:
                          type: string

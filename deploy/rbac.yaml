apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-greeting-operator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-greeting-operator
rules:
  - apiGroups:
      - demo.kube-ocaml.dev
    resources:
      - greetings
      - greetings/status
      - greetings/finalizers
    verbs:
      - get
      - list
      - watch
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-greeting-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-greeting-operator
subjects:
  - kind: ServiceAccount
    name: kube-greeting-operator
    namespace: default

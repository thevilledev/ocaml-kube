apiVersion: v1
kind: Pod
metadata:
  name: ocaml-kube-streaming-check
  namespace: default
  labels:
    ocaml-kube.dev/integration: streaming
spec:
  restartPolicy: Never
  containers:
    - name: server
      image: registry.k8s.io/e2e-test-images/busybox:1.29-4
      command:
        - sh
        - -c
        - mkdir -p /www && printf port-forward-ok >/www/proof.txt && httpd -f -p 8080 -h /www
      readinessProbe:
        tcpSocket:
          port: 8080
        periodSeconds: 1
    - name: attached
      image: registry.k8s.io/e2e-test-images/busybox:1.29-4
      command:
        - sh
        - -c
        - cat
      stdin: true
      stdinOnce: true

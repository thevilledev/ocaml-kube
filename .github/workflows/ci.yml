name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: avrea-ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler: ["5.1.1", "5.2.1", "5.3.0", "5.4.1", "5.5.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
      - run: opam install . --deps-only --with-test --with-doc
      - run: opam exec -- dune build @all @install @doc @codegen-check
      - run: opam exec -- dune runtest
      - run: opam lint kube.opam

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.1"
          dune-cache: true
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build @all @install
      - run: opam exec -- dune exec test/test_portability.exe

  lower-bounds:
    runs-on: avrea-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.1"
          dune-cache: true
      - name: Install with lower dependency bounds
        run: >-
          opam install --solver=builtin-0install
          "--criteria=+count[version-lag,solution]" .

  scaffold-acceptance:
    runs-on: avrea-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.0"
          dune-cache: true
      - run: opam install . --deps-only --with-test
      - run: test/scaffold_acceptance.sh

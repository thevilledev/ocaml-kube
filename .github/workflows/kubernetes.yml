name: Kubernetes compatibility

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  kind:
    runs-on: avrea-ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - minor: "1.34"
            image: "kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d"
          - minor: "1.35"
            image: "kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0"
          - minor: "1.36"
            image: "kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed"
          - minor: "1.37"
            image: "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.0"
          dune-cache: true
      - run: opam install . --deps-only --with-test
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
      - run: kind create cluster --name ocaml-kube --image "${{ matrix.image }}" --kubeconfig kubeconfig.kind --wait 120s
      - run: test/integration_kind.sh
      - if: always()
        run: kind export logs "kind-logs-${{ matrix.minor }}" --name ocaml-kube
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kind-${{ matrix.minor }}-logs
          path: |
            kind-logs-${{ matrix.minor }}
            _build/greeting-operator-a.integration.log
            _build/greeting-operator-b.integration.log
